# claude-status-line-go configuration file
# Place in ~/.config/claude-status-line-go/claude-status-line.yaml

# Show/hide sections
show_cost: true              # Show session cost
show_weekly: true            # Show weekly usage
show_tokens: true            # Show token counts
show_git: true               # Show git branch
show_git_dirty: true         # Show dirty file count

# Progress bar settings
bar_size: 10                 # Width of progress bars

# Thresholds (%)
limit_warn: 60               # Rate limit warning threshold (5-hour and weekly)
limit_crit: 85               # Rate limit critical threshold (5-hour and weekly)
ctx_warn: 60                 # Context window warning threshold
ctx_crit: 85                 # Context window critical threshold
weekly_show_at: 60           # Show weekly usage when >= this %

# Output format (overrides the default layout)
# Available placeholders:
#   {model} {ctx_size} {project} {branch} {dirty}
#   {limit_bar} {limit_pct} {limit_reset}
#   {weekly_bar} {weekly_pct} {weekly_reset}
#   {ctx_bar} {ctx_pct}
#   {tokens_total} {tokens_out} {cache_hit_pct}
#   {tokens_in} {tokens_cache}
#   {cost}
#   {reset} {dim} {bold}
#   {red} {green} {yellow} {blue} {magenta} {cyan} {white}
# format: "{cyan}🧠 {model}·{ctx_size}{reset} {dim}│ 📁 {project}{reset}"

# Disable colors (also available via NO_COLOR env var)
# no_color: false

# Plugins add your own segments. A plugin reports data — a value, an optional
# max, maybe a label — and this tool draws it, so plugin segments use the same
# bar glyphs, bar_size and NO_COLOR handling as the built-in ones.
#
# Source JSON looks like:  {"value": 12, "max": 33, "label": "aplicar"}
# Bare text works too, and is taken as {"text": "..."}.
# Any key the contract doesn't define is reachable as {plugin.<name>.<key>},
# which is how one plugin reports several things.
#
# A command source never runs on the render path. The render reads a cached
# value and, if it's older than `interval`, hands the work to a detached
# process and draws the stale value immediately. So a 350ms `gh` call costs
# the status line nothing — it just means the number can be up to `interval`
# old. The command gets the session JSON on stdin and runs in the project
# directory, with CSL_PROJECT_DIR and CSL_PLUGIN_NAME set.
#
# plugins:
#   - name: issues
#     command: >-
#       printf '{"value":%s,"max":100}'
#       "$(gh issue list --json number --jq 'length')"
#     interval: 60s                   # how long a cached value stays fresh (default 60s)
#     timeout: 5s                     # caps one run of the command (default 5s)
#     icon: "🎯"
#     bar: true
#
# plugins:
#   - name: spec
#     file: .claude/spec-state.json   # read at render time, costs nothing
#     icon: "🧩"
#     bar: true
#     display: "{icon} {label} {bar} {value}/{max}"   # optional; omit for a sensible default
#     hide_when: zero                 # drop the segment when the value is 0
#                                     # ("full" drops it when value reaches max)
#     thresholds:                     # `at` is a lower bound in percent
#       - { at: 0,  color: red }      # list them the other way round for an
#       - { at: 40, color: yellow }   # inverted ramp — there's no invert flag
#       - { at: 80, color: green }
#
# Placeholders for the `format` field above:
#   {plugin.spec}          the finished segment
#   {plugin.spec.value}    {plugin.spec.max}   {plugin.spec.pct}
#   {plugin.spec.bar}      {plugin.spec.text}  {plugin.spec.label}
#   {plugin.spec.<key>}    anything extra the plugin reported
