# claude-status-line-go configuration file
# Place in ~/.config/claude-status-line-go/claude-status-line.yaml

# Show/hide sections
show_cost: true              # Show session cost
show_weekly: true            # Show weekly usage
show_tokens: true            # Show token counts
show_git: true               # Show git branch
show_git_dirty: true         # Show dirty file count

# Progress bar settings
bar_size: 10                 # Width of progress bars

# Thresholds (%)
limit_warn: 60               # Rate limit warning threshold
limit_crit: 85               # Rate limit critical threshold
ctx_warn: 60                 # Context window warning threshold
ctx_crit: 85                 # Context window critical threshold
weekly_show_at: 60           # Show weekly usage when >= this %

# Output format (overrides the default layout)
# Available placeholders:
#   {model} {ctx_size} {project} {branch} {dirty}
#   {limit_bar} {limit_pct} {limit_reset}
#   {ctx_bar} {ctx_pct}
#   {tokens_in} {tokens_out} {tokens_cache}
#   {cost} {weekly_pct}
#   {reset} {dim} {bold}
#   {red} {green} {yellow} {blue} {magenta} {cyan} {white}
# format: "{cyan}🧠 {model}·{ctx_size}{reset} {dim}│ 📁 {project}{reset}"

# Disable colors (also available via NO_COLOR env var)
# no_color: false
