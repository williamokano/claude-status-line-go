# claude-status-line-go configuration
#
# Everything here is already the default, so an untouched file changes nothing.
# Uncomment and edit what you want to differ.
#
#   claude-status-line-go config path    where this file lives
#   claude-status-line-go plugins        what your plugins are doing
#
# Environment variables override this file: CSL_BAR_SIZE, CSL_SHOW_COST, and so
# on, one per setting below.

# Show/hide sections
show_cost: true              # Session cost
show_weekly: true            # Weekly rate-limit window
show_tokens: true            # Token counts
show_git: true               # Git branch
show_git_dirty: true         # Uncommitted file count

# Progress bar settings
bar_size: 10                 # Width of every progress bar, plugins included

# Thresholds (%)
limit_warn: 60               # Rate limit warning (5-hour and weekly)
limit_crit: 85               # Rate limit critical (5-hour and weekly)
ctx_warn: 60                 # Context window warning
ctx_crit: 85                 # Context window critical
weekly_show_at: 60           # Show the weekly window once it reaches this %

# Output format (replaces the default two-line layout)
# Available placeholders:
#   {model} {ctx_size} {project} {branch} {dirty}
#   {limit_bar} {limit_pct} {limit_reset}
#   {weekly_bar} {weekly_pct} {weekly_reset}
#   {ctx_bar} {ctx_pct}
#   {tokens_total} {tokens_out} {cache_hit_pct}
#   {tokens_in} {tokens_cache}
#   {cost}
#   {reset} {dim} {bold}
#   {red} {green} {yellow} {blue} {magenta} {cyan} {white}
#   {plugin.<name>} and {plugin.<name>.<field>} for each plugin below
# format: "{cyan}🧠 {model}·{ctx_size}{reset} {dim}│ 📁 {project}{reset}"

# Disable colors (also available via the NO_COLOR env var)
# no_color: false

# ── Plugins ──────────────────────────────────────────────────────────────────
#
# A plugin reports data — a value, an optional max, maybe a label — and this
# tool draws it, so plugin segments use the same bar glyphs, bar_size and
# NO_COLOR handling as the built-in ones.
#
# Output JSON looks like:  {"value": 12, "max": 33, "label": "aplicar"}
# Bare text works too, and is taken as {"text": "..."}.
# Any key the contract doesn't define is reachable as {plugin.<name>.<key>},
# which is how one plugin reports several things at once.
#
# A command source never runs while the status line is drawing. The render
# reads a cached value and, if it's older than `interval`, hands the work to a
# detached process and draws the stale value immediately — so a 350ms `gh` call
# costs the line nothing, it just means the number can be up to `interval` old.
# The command gets the session JSON on stdin and runs in the project directory,
# with CSL_PROJECT_DIR and CSL_PLUGIN_NAME set.
#
# Full guide: https://okano.dev/claude-status-line-go/plugins/
#
# plugins:
#   # Commits you haven't pushed. No tokens, no setup, works in any git repo.
#   - name: unpushed
#     command: >-
#       printf '{"value":%s,"max":20,"label":"unpushed"}'
#       "$(git log --oneline @{u}.. 2>/dev/null | wc -l)"
#     interval: 30s              # how long a cached value stays fresh (default 60s)
#     timeout: 5s                # caps one run of the command (default 5s)
#     icon: "⬆"
#     bar: true
#     hide_when: zero            # say nothing when you're in sync
#     thresholds:                # `at` is a lower bound in percent
#       - { at: 0,  color: green }
#       - { at: 25, color: yellow }
#       - { at: 50, color: red }
#
#   # Read straight off disk — costs nothing, ideal when a hook writes the file.
#   - name: spec
#     file: .claude/spec-state.json
#     icon: "🧩"
#     bar: true
#     display: "{icon} {label} {bar} {value}/{max}"
#     hide_when: full            # drop it once value reaches max
