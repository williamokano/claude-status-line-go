<!-- Source for og.png. Render at 1200x630, DSF 1, and save to docs/og.png:
     npx playwright screenshot --viewport-size=1200,630 docs/og-card.html docs/og.png -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0F1319; --ground-2:#121820; --surface:#18202A;
  --line:#26313D; --ink:#DCE3EB; --ink-2:#93A1AF; --ink-3:#737F8D;
  --cyan:#4FD6C8; --green:#7FD88F; --yellow:#E8C468; --red:#EC8468;
  --font-display:'Archivo',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:1200px;height:630px;overflow:hidden;
  background:
    radial-gradient(120% 90% at 88% 6%, rgba(79,214,200,.10), transparent 58%),
    var(--ground);
  color:var(--ink);
  font-family:var(--font-display);
  display:flex;flex-direction:column;justify-content:center;
  padding:0 76px;
  -webkit-font-smoothing:antialiased;
}
.eyebrow{
  font-family:var(--font-mono);font-size:21px;font-weight:500;
  letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3);
  display:flex;align-items:center;gap:12px;margin-bottom:30px;
}
.eyebrow b{color:var(--cyan);font-weight:400;font-size:24px}
h1{
  font-family:var(--font-display);font-size:82px;font-weight:700;
  font-stretch:118%;line-height:.95;letter-spacing:-.025em;
  margin-bottom:44px;
}
.sl{
  border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg,var(--surface),var(--ground-2));
  padding:26px 30px;
  box-shadow:0 30px 70px -34px rgba(0,0,0,.95);
}
.sl p{font-family:var(--font-mono);font-size:29px;line-height:1.75;white-space:pre}
.dim{color:var(--ink-3)} .cy{color:var(--cyan)} .ok{color:var(--green)}
.warn{color:var(--yellow)} .crit{color:var(--red)} .money{color:var(--yellow)}
.foot{
  margin-top:34px;font-family:var(--font-mono);font-size:22px;color:var(--ink-3);
  display:flex;align-items:center;gap:14px;
}
.foot .go{color:var(--ink-2)}
</style>
</head>
<body>
  <p class="eyebrow"><b>▚</b>claude-status-line-go</p>
  <h1>How much Claude&nbsp;Code<br>have you got left?</h1>
  <div class="sl">
    <p><span class="cy">🧠 Opus 5·1M</span><span class="dim"> │ 📁 claude-status-line-go │ 🌿 main ●3</span></p>
    <p><span class="warn">🟡5h ████████░░ 83% ↺ 22m</span><span class="dim"> │ </span><span class="warn">CTX ██████░░░░ 68%</span><span class="dim"> │ </span><span class="money">$7.92</span></p>
  </div>
  <p class="foot"><span class="go">go install</span> github.com/williamokano/claude-status-line-go</p>
</body>
</html>
